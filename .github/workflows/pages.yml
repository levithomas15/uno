# Veröffentlicht die Web-Fassung des Spiels auf GitHub Pages.
#
# Einmalig nötig: Settings → Pages → Source auf "GitHub Actions" stellen.
# Danach liegt das Spiel unter https://<name>.github.io/uno/
#
# Achtung: Pages liefert nur Dateien aus. Solo und "abwechselnd auf einem
# Handy" laufen damit vollständig; für Online-Partien braucht es zusätzlich
# den Server aus uno/server (siehe uno/README.md).

name: Spiel veröffentlichen

on:
  push:
    branches:
      - main
      - claude/uno-game-multiplayer-s92glv
    paths:
      - 'uno/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pruefen:
    name: Regelwerk prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        working-directory: uno
        run: node --test 'test/*.mjs'

  veroeffentlichen:
    name: Auf Pages stellen
    needs: pruefen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir -p site
          cp -r uno/index.html uno/css uno/js site/
          cp uno/README.md site/
          # Jekyll soll nichts anfassen.
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
